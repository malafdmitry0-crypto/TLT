# Project MCP: kontur_playwright unblocks AF browser matrix.
# Requires e2e deps (`cd e2e && npm i`) and Google Chrome (or set --browser chromium).

[mcp_servers.kontur_playwright]
command = "node"
args = [
  "/Users/dmalafey/Desktop/TLT/e2e/node_modules/playwright-core/lib/tools/mcp/cli-stub.js",
  "--headless",
  "--browser",
  "chrome",
  "--output-dir",
  "/Users/dmalafey/Desktop/TLT/.playwright-mcp",
  "--viewport-size",
  "1440x1000",
  "--console-level",
  "warning",
]
enabled = true
startup_timeout_sec = 60

# Official Storybook MCP (React): requires `cd frontend && npm run storybook`
# Endpoint served by @storybook/addon-mcp at /mcp
[mcp_servers.storybook]
url = "http://127.0.0.1:6006/mcp"
enabled = true
startup_timeout_sec = 15
