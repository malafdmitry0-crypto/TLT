# Project MCP servers (Grok). kontur_playwright unblocks AF browser matrix.
# Requires: e2e deps installed; Chrome (or change --browser chromium).

[mcp_servers.kontur_playwright]
command = "node"
args = [
  "e2e/node_modules/playwright-core/lib/tools/mcp/cli-stub.js",
  "--headless",
  "--browser",
  "chrome",
  "--output-dir",
  ".playwright-mcp",
  "--viewport-size",
  "1440x1000",
  "--console-level",
  "warning",
]
enabled = true
startup_timeout_sec = 60
