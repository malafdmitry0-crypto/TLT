server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip для текстовых ассетов
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite кладёт content hash в имена файлов, поэтому production-ассеты можно
  # кэшировать агрессивно: при изменении содержимого меняется URL.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Проксирование REST-API в backend. /api/v1/ — путь, заданный VITE_API_BASE_URL.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Стриминг blob-ответов (PDF/DOCX/XLSX-экспорт)
    proxy_buffering off;
    client_max_body_size 20m;
  }

  # SPA-fallback: все прочие пути отдают index.html (React Router)
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri $uri/ /index.html;
  }
}
