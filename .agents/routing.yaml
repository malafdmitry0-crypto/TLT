version: 1
project: TLT
purpose: "Codex multi-agent routing for functional accuracy, safe fixes, and release gates."

global_start:
  - AGENTS.md
  - codex-docs/README.md
  - codex-docs/project-map.md
  - codex-docs/requirements-map.md
  - codex-docs/testing.md
  - .agents/routing.yaml

global_stop_conditions:
  - "Do not accept in-scope behavior without documentation -> code -> tests evidence."
  - "Do not change expected/golden values without an independent source of truth."
  - "Do not close UI/layout scope without before/after screenshots and verifier evidence."
  - "Do not use frontend-only checks as proof for RBAC/security."
  - "Do not let multiple code-edit agents write to the same files."
  - "If browser, DB, Docker, or Playwright is unavailable for in-scope evidence, report blocked."

modes:
  audit_only:
    slash: "/audit-only"
    code_changes: false
    output: "Findings with severity, file:line, evidence, residual risk."
  fix_focused:
    slash: "/fix-focused"
    code_changes: true
    output: "Root cause, minimal patch, focused test/verifier, command results."
  ui_proof:
    slash: "/ui-proof"
    code_changes: true
    output: "Before screenshot, DOM/CSS cause, patch, verifier, after screenshot."
  release_gate:
    slash: "/release-gate"
    code_changes: false
    output: "Gate results, blockers, infrastructure failures, residual risks."

roles:
  functional_accuracy:
    file: .agents/roles/functional-accuracy.md
    primary_when:
      - "Feature behavior must be evaluated or fixed end-to-end."
      - "The task touches documentation, backend, frontend, persistence, and tests."
    default_mode: fix_focused
    owns:
      - "Evidence chain and final Functional Accuracy Report."
      - "Scope control and stop/blocker decisions."
    sidecars:
      - docs_contract
      - backend_business
      - frontend_ui_proof
      - qa_regression

  docs_contract:
    file: .agents/roles/docs-contract.md
    primary_when:
      - "Requirement, SRS, API, or formula contract is unclear."
      - "A drift check or source-of-truth decision is needed."
    default_mode: audit_only
    owns:
      - "Documentation sources, requirement mapping, contract drift findings."
    sidecars:
      - formula_oracle
      - backend_business

  formula_oracle:
    file: .agents/roles/formula-oracle.md
    primary_when:
      - "Formula, coefficient, catalog, heat loss, cable selection, specification math."
      - "Golden, boundary, metamorphic, or mutation evidence is needed."
    default_mode: fix_focused
    owns:
      - "Formula source traceability and independent oracle evidence."
    sidecars:
      - docs_contract
      - backend_business

  backend_business:
    file: .agents/roles/backend-business.md
    primary_when:
      - "API endpoint, service layer, DB persistence, import/export, reports, RBAC backend."
    default_mode: fix_focused
    owns:
      - "Backend API/service/model/schema behavior and DB invariants."
    sidecars:
      - security_rbac
      - performance_db
      - qa_regression

  frontend_ui_proof:
    file: .agents/roles/frontend-ui-proof.md
    primary_when:
      - "React page/component, workflow UI, layout, accessibility, screenshots."
      - "HeatCalcPage or ElecCalcPage decomposition touches visible behavior."
    default_mode: ui_proof
    owns:
      - "Frontend behavior, payload shape, visual evidence, Playwright proof."
    sidecars:
      - backend_business
      - qa_regression

  qa_regression:
    file: .agents/roles/qa-regression.md
    primary_when:
      - "Regression gate, flaky failure, test coverage gap, release verification."
    default_mode: audit_only
    owns:
      - "Test selection, gate execution, artifact inspection, residual risk."
    sidecars:
      - frontend_ui_proof
      - backend_business

  security_rbac:
    file: .agents/roles/security-rbac.md
    primary_when:
      - "Authentication, authorization, guest/session isolation, secrets, audit logs."
    default_mode: audit_only
    owns:
      - "Backend security boundaries and negative tests."
    sidecars:
      - backend_business

  performance_db:
    file: .agents/roles/performance-db.md
    primary_when:
      - "Search, lists, batch calculations, imports, N+1, full scans, query counts."
    default_mode: audit_only
    owns:
      - "DB/query/performance evidence and scale risk findings."
    sidecars:
      - backend_business

routing_rules:
  - match:
      - "HeatCalcPage"
      - "ElecCalcPage"
      - "React page"
      - "layout"
      - "UI"
    primary: frontend_ui_proof
    required_sidecars:
      - qa_regression
    notes: "If calculation payload or persistence changes, add backend_business."

  - match:
      - "formula"
      - "coefficient"
      - "heat loss"
      - "cable selection"
      - "specification totals"
    primary: formula_oracle
    required_sidecars:
      - docs_contract
    notes: "Run formula QA quick/full; mutation for critical formula changes."

  - match:
      - "API"
      - "service"
      - "database"
      - "persistence"
      - "import"
      - "export"
      - "report"
    primary: backend_business
    required_sidecars:
      - qa_regression
    notes: "Run backend unit/integration and DB invariants for persisted workflows."

  - match:
      - "auth"
      - "role"
      - "RBAC"
      - "guest"
      - "session"
      - "permission"
    primary: security_rbac
    required_sidecars:
      - backend_business
    notes: "Frontend guards are not security evidence."

  - match:
      - "release"
      - "pre-release"
      - "gate"
      - "deep"
    primary: qa_regression
    required_sidecars:
      - functional_accuracy
    notes: "Use release_gate mode; do not fix unrelated blockers without confirmation."

nightly_prompts:
  god_components_safe_split:
    file: docs/playbooks/god-components-safe-split-nightly-prompt.md
    primary: frontend_ui_proof
    supporting:
      - functional_accuracy
      - qa_regression
      - backend_business
    max_code_slice: "One PR-sized vertical slice."
    stop_on:
      - "Missing characterization tests."
      - "Missing UI screenshots for touched visual behavior."
      - "Payload, units, persistence, or formula traceability cannot be verified."
