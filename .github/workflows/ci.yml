name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  heat-loss-core:
    name: Heat-loss core package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package test tools
        run: python -m pip install 'setuptools>=68' pytest==9.0.3 ruff==0.6.9 mypy==1.11.2 mutmut==3.5.0
      - name: Build wheel
        working-directory: backend/packages/heat-loss-core
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Install wheel in an isolated environment and import public API
        run: |
          python -m venv /tmp/heat-loss-core-venv
          /tmp/heat-loss-core-venv/bin/pip install --no-deps backend/packages/heat-loss-core/dist/*.whl
          env -u PYTHONPATH /tmp/heat-loss-core-venv/bin/python -I -c 'import heatcalc_heat_loss_core as core; import heatcalc_heat_loss_core.api as api; removed = {"evaluate_pipe", "evaluate_resolved_air_tank", "evaluate_resolved_buried_tank", "resolve_safety_factor"}; assert core.__all__ == api.__all__; assert all(hasattr(core, name) for name in core.__all__); assert all(not hasattr(core, name) for name in removed)'
      - name: Package tests, lint, and types
        working-directory: backend/packages/heat-loss-core
        run: |
          python -m pip install -e .
          python -m pytest tests
          ruff check src tests
          mypy src tests
      - name: Standalone core mutation score
        working-directory: backend/packages/heat-loss-core
        run: mutmut run
      - name: Enforce standalone core mutation floor
        working-directory: backend
        env:
          MUTMUT_SCOPE: core
        run: python scripts/mutmut_score_gate.py

  electrical-core:
    name: Electrical core package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package test tools
        run: python -m pip install 'setuptools>=68' pytest==9.0.3 ruff==0.6.9 mypy==1.11.2 mutmut==3.5.0
      - name: Build wheel
        working-directory: backend/packages/electrical-core
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Install wheel in an isolated environment and import public API
        run: |
          python -m venv /tmp/electrical-core-venv
          /tmp/electrical-core-venv/bin/pip install --no-deps backend/packages/electrical-core/dist/*.whl
          env -u PYTHONPATH /tmp/electrical-core-venv/bin/python -I -c 'import heatcalc_electrical_core as core; import heatcalc_electrical_core.api as api; expected = {"BomCatalogRow", "CableOption", "CatalogBundle", "ELECTRICAL_TT_FORMULA_FINGERPRINT", "ELECTRICAL_TT_FORMULA_VERSION", "EqualSection", "OptionsOutcome", "PipeLayout", "PowerCatalogRow", "SectionCatalogRow", "TTFormulaDomainError", "TTFormulaIssue", "TTFormulaOutcome", "TTFormulaReport", "TTFormulaResult", "TTPreparationInput", "TankLayout", "catalog_bundle_from_payload", "compute_tank_cable_length", "list_tt_cable_options", "run_tt_formula"}; assert set(core.__all__) == expected; assert core.__all__ == api.__all__; assert all(hasattr(core, name) for name in expected)'
      - name: Package tests, lint, and types
        working-directory: backend/packages/electrical-core
        run: |
          python -m pip install -e .
          python -m pytest tests
          ruff check src tests
          mypy src tests
      - name: Standalone electrical core mutation score
        working-directory: backend/packages/electrical-core
        run: mutmut run
      - name: Enforce standalone electrical core mutation floor
        working-directory: backend
        env:
          MUTMUT_SCOPE: electrical-core
        run: python scripts/mutmut_score_gate.py

  specification-core:
    name: Specification core package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package test tools
        run: python -m pip install 'setuptools>=68' pytest==9.0.3 ruff==0.6.9 mypy==1.11.2 mutmut==3.5.0
      - name: Build wheel
        working-directory: backend/packages/specification-core
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Install wheel in an isolated environment and import public API
        run: |
          python -m venv /tmp/specification-core-venv
          /tmp/specification-core-venv/bin/pip install --no-deps backend/packages/specification-core/dist/*.whl
          env -u PYTHONPATH /tmp/specification-core-venv/bin/python -I -c 'import heatcalc_specification_core as core; import heatcalc_specification_core.api as api; expected = ["build_candidate_groups", "prepare_specification", "run_specification"]; removed = {"calculate_box_quantity", "calculate_cable_mark", "calculate_connection_kits", "merge_items"}; assert core.__all__ == expected == api.__all__; assert all(hasattr(core, name) for name in expected); assert all(not hasattr(core, name) for name in removed)'
      - name: Package tests, lint, and types
        working-directory: backend/packages/specification-core
        run: |
          python -m pip install -e .
          python -m pytest tests
          ruff check src tests
          mypy src tests
      - name: Standalone specification core mutation score
        working-directory: backend/packages/specification-core
        run: mutmut run
      - name: Enforce standalone specification core mutation floor
        working-directory: backend
        env:
          MUTMUT_SCOPE: specification-core
        run: python scripts/mutmut_score_gate.py

  frontend-dod:
    name: Frontend full DoD (test:agent-dod:dual-safe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Full frontend DoD
        working-directory: frontend
        # Canonical command only — same one AGENTS.md and the standard name.
        # Do not reassemble from partial scripts.
        run: npm run test:agent-dod:dual-safe

  build-and-smoke:
    name: Build demo stack + smoke/UI gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Сборка образов
        run: docker compose build backend frontend
      - name: Backend strict-mypy shrink-only ratchet
        run: python3 scripts/backend-mypy-ratchet.py
      - name: Тегирование под demo-версию
        run: |
          docker tag heatcalc-backend:latest  heatcalc-backend:1.2.1-demo
          docker tag heatcalc-frontend:latest heatcalc-frontend:1.2.1-demo
      - name: Запуск demo-стека
        run: |
          cd demo
          docker compose up -d
          # ждём backend healthy до 2 минут
          for i in {1..60}; do
            docker compose ps backend --format "{{.Status}}" | grep -q healthy && exit 0
            sleep 2
          done
          echo "Backend не стал healthy за 2 минуты" >&2
          docker compose logs backend
          exit 1
      - name: Smoke-тесты против http://localhost:8080
        run: scripts/smoke.sh http://localhost:8080
      - name: DB-инварианты после smoke
        run: scripts/codex-functional-audit.sh db-invariants
      - name: Установить Playwright
        run: |
          npm ci --prefix e2e
          npm --prefix e2e exec playwright install --with-deps chromium
      - name: Layout regression против demo stack
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:8080
          E2E_API_BASE: http://localhost:8080
        run: scripts/codex-functional-audit.sh layout
      - name: Accessibility gate против demo stack
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:8080
          E2E_API_BASE: http://localhost:8080
        run: scripts/codex-functional-audit.sh accessibility
      - name: User flows против demo stack
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:8080
          E2E_API_BASE: http://localhost:8080
        run: scripts/codex-functional-audit.sh user-flows
      - name: Загрузить Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
      - name: Логи при падении
        if: failure()
        run: |
          cd demo
          docker compose logs --tail=200

  formula-mutation:
    name: Formula mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Сборка dev backend с mutmut
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build backend
      - name: Mutation testing формул
        run: scripts/codex-functional-audit.sh mutation
      - name: Логи при падении
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200 backend db redis
