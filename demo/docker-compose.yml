# =====================================================================
# ТЛТ · Демо-сборка для локального запуска
# =====================================================================
# Использует готовые образы. Ничего настраивать не требуется.
# Запуск:    docker compose up -d --wait --wait-timeout 180
# Остановка: docker compose down
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: heatcalc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: heatcalc
      POSTGRES_PASSWORD: heatcalc_pass
      POSTGRES_DB: heatcalc_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatcalc -d heatcalc_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: heatcalc_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: heatcalc-backend:${IMAGE_TAG:-1.3.0-demo}
    container_name: heatcalc_backend
    restart: unless-stopped
    environment:
      # Локальное демо по HTTP под одним пользователем: non-production, поэтому
      # validate_runtime_security() не требует смены admin/admin и Secure-cookie.
      APP_ENV: demo
      DATABASE_URL: postgresql+asyncpg://heatcalc:heatcalc_pass@db:5432/heatcalc_db
      # Учётная запись первого администратора (создаётся при первом старте)
      FIRST_ADMIN_EMAIL: admin@heatcalc.io
      FIRST_ADMIN_PASSWORD: admin
      # Автоматический прогон тестовых данных при старте
      RUN_SEEDS: "1"
      # Distributed rate limiter — переживает рестарт + работает на N инстансах
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - report_artifacts:/var/lib/heatcalc/reports

  worker:
    image: heatcalc-backend:${IMAGE_TAG:-1.3.0-demo}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+asyncpg://heatcalc:heatcalc_pass@db:5432/heatcalc_db
      REDIS_URL: redis://redis:6379/0
      REPORT_ARTIFACT_DIR: /var/lib/heatcalc/reports
      WORKER_QUEUE_CONSUMER: worker-demo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - report_artifacts:/var/lib/heatcalc/reports

  frontend:
    image: heatcalc-frontend:${IMAGE_TAG:-1.3.0-demo}
    container_name: heatcalc_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      # Приложение доступно на http://localhost:8080
      # Чтобы сменить порт — измените ЛЕВУЮ цифру (например "9000:80")
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost/ && wget --quiet --spider http://backend:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  report_artifacts:
