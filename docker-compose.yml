services:
  db:
    image: postgres:16-alpine
    container_name: heatcalc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heatcalc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatcalc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-heatcalc_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heatcalc} -d ${POSTGRES_DB:-heatcalc_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: heatcalc_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: heatcalc-backend:${IMAGE_TAG:-latest}
    container_name: heatcalc_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://heatcalc:heatcalc_pass@db:5432/heatcalc_db}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+asyncpg://heatcalc:heatcalc_pass@db:5432/heatcalc_test}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@heatcalc.io}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      GUEST_SESSION_HOURLY_LIMIT: ${GUEST_SESSION_HOURLY_LIMIT:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # python -c вместо curl — работает и в dev (Dockerfile.dev без curl), и в prod
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/docs', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Относительный путь — nginx внутри frontend-контейнера проксирует на backend.
        # Не зависит от .env, чтобы случайное локальное значение (например dev-адрес
        # http://localhost:8000) не попало в prod/demo-бандл.
        VITE_API_BASE_URL: /api/v1
    image: heatcalc-frontend:${IMAGE_TAG:-latest}
    container_name: heatcalc_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3003}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
