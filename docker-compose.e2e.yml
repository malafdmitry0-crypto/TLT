services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: heatcalc_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d heatcalc_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/heatcalc_test
      SECRET_KEY: test-secret
      # Учётные данные сидов — единый формат с dev/demo (admin@heatcalc.io).
      FIRST_ADMIN_EMAIL: admin@heatcalc.io
      FIRST_ADMIN_PASSWORD: admin
      # E2E создаёт много гостевых сессий с одного IP; лимит не должен маскировать UI-регрессии.
      GUEST_SESSION_HOURLY_LIMIT: "500"
    depends_on:
      db-test:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://backend-test:8000/api/v1
    depends_on:
      - backend-test
    ports:
      - "3001:3000"
