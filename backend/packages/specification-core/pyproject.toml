[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatcalc-specification-core"
version = "0.2.0"
description = "Pure specification calculation, catalog-condition, and grouping core"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.mutmut]
# Cover the complete specification decision surface. Contracts, serializers,
# and namespace plumbing remain covered by pytest, mypy, and architecture guards.
paths_to_mutate = [
    "src/heatcalc_specification_core/bom/pipeline.py",
    "src/heatcalc_specification_core/candidates/filtering.py",
    "src/heatcalc_specification_core/candidates/selections.py",
    "src/heatcalc_specification_core/candidates/fingerprint.py",
    "src/heatcalc_specification_core/catalog/validation.py",
    "src/heatcalc_specification_core/catalog/box_validation.py",
    "src/heatcalc_specification_core/preflight/pipeline.py",
    "src/heatcalc_specification_core/bom/grouping.py",
]
pytest_add_cli_args = [
    "--no-cov",
    "--ignore=tests/test_architecture.py",
    "--ignore=tests/candidates/test_candidate_architecture.py",
]
tests_dir = ["tests"]
also_copy = ["src/heatcalc_specification_core"]
backup = false

[tool.setuptools.package-data]
heatcalc_specification_core = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
