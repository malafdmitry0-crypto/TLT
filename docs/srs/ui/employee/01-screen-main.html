<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SC-02. Форма входа Сотрудника</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", -apple-system, sans-serif; background: #eef3f6; color: #1a2734; }
  .topbar { background: linear-gradient(180deg, #1f4e69, #163b50); color: #fff; padding: 10px 20px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .stage { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px); padding: 40px 20px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10); padding: 40px 50px; max-width: 480px; width: 100%; }
  .card h1 { margin: 0 0 4px 0; font-size: 22px; color: #1f4e69; text-align: center; }
  .card .sub { color: #607080; font-size: 14px; margin-bottom: 28px; text-align: center; }
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-size: 12px; color: #607080; margin-bottom: 4px; font-weight: 600; }
  .form-row input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #c4d2db; border-radius: 4px; background: #fff; }
  .form-row input:focus { outline: 2px solid #b6cee0; border-color: #1f4e69; }
  .form-row .hint { font-size: 11px; color: #91a1ae; margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 24px; }
  .actions button { flex: 1; padding: 12px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; }
  .actions .login { background: #1f4e69; color: #fff; border: 1px solid #1f4e69; font-weight: 600; }
  .actions .cancel { background: #fff; color: #4a5b6c; border: 1px solid #c4d2db; }
  .back { display: inline-block; color: #1f4e69; text-decoration: none; font-size: 13px; margin-bottom: 16px; }
  .role-tag { background: #c2e0c0; color: #1f6f3e; font-weight: 600; font-size: 11px; padding: 3px 10px; border-radius: 12px; }
  .error { background: #fdeaea; color: #b1281f; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 16px; border-left: 3px solid #b1281f; }
</style>
</head>
<body>

<div class="topbar">
  <span style="font-weight: 600;">ТЛТ — Вход для сотрудников</span>
  <span style="opacity: 0.75; font-size: 12px;">UI-прототип SC-02</span>
</div>

<div class="stage">
  <div class="card">
    <a href="#" class="back">← Вернуться к выбору режима</a>
    <h1>Вход в систему</h1>
    <div class="sub">для авторизованных <span class="role-tag">Сотрудников</span></div>

    <!-- Пример с ошибкой (закомментирован) -->
    <!-- <div class="error">⚠ Неверный логин или пароль</div> -->

    <div class="form-row">
      <label>Логин (e-mail)</label>
      <input type="email" placeholder="ivanov@tlt.ru">
      <div class="hint">Введите ваш корпоративный e-mail</div>
    </div>

    <div class="form-row">
      <label>Пароль</label>
      <input type="password" placeholder="••••••••">
      <div class="hint">Содержимое скрывается; в сообщениях об ошибках не раскрывается</div>
    </div>

    <div class="actions">
      <button class="cancel">Отмена</button>
      <button class="login">Войти</button>
    </div>
  </div>
</div>

</body>
</html>
